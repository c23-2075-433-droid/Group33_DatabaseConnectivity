<rect x="345" y="1052" width="315" height="140" rx="8" fill="#eef3fb" stroke="#3b5b8c" stroke-width="2"/>
<text x="361" y="1076" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.2" fill="#3b5b8c" dominant-baseline="central">POSTGREST</text>
<text x="361" y="1104.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">player_scores: INSERT</text>
<text x="361" y="1124.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">nickname_claims: INSERT, SELECT</text>
<text x="361" y="1144.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">leaderboard: SELECT (read only)</text>
<text x="361" y="1164.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">rpc leaderboard_rank</text>
<rect x="345" y="1202" width="315" height="118" rx="8" fill="#fff7ea" stroke="#b7791f" stroke-width="2"/>
<text x="361" y="1226" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.2" fill="#b7791f" dominant-baseline="central">EDGE FUNCTION submit-score</text>
<text x="361" y="1254.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">The only leaderboard writer;</text>
<text x="361" y="1274.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">issues and checks an</text>
<text x="361" y="1294.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">ownership token</text>
<rect x="670" y="1052" width="305" height="268" rx="8" fill="#ffffff" stroke="#4a6a8a" stroke-width="2" stroke-dasharray="8 6"/>
<text x="686" y="1076" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.2" fill="#4a6a8a" dominant-baseline="central">LEAVES THE DEVICE</text>
<text x="686" y="1104.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">Level record</tspan> (5th scene):</text>
<text x="686" y="1124.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">nickname · score · attempts</text>
<text x="686" y="1144.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">· level · remarks</text>
<text x="686" y="1164.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">Leaderboard</tspan> (main menu):</text>
<text x="686" y="1185.2" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">player ID · nickname · points</text>
<text x="686" y="1205.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">· stars · ownership token</text>
<text x="686" y="1225.8" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">Nickname claim</tspan> (dialog):</text>
<text x="686" y="1246.1" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">nickname · installation ID</text>
<text x="686" y="1266.4" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">No audio, no attempt log</text>

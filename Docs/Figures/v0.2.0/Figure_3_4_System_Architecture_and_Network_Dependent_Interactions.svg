<text x="282" y="738.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">nickname_claims: INSERT, SELECT</text>
<text x="282" y="757.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">leaderboard: SELECT · rank (rpc)</text>
<rect x="266" y="782" width="262" height="89" rx="8" fill="#fff7ea" stroke="#b7791f" stroke-width="2"/>
<text x="282" y="806" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#b7791f" dominant-baseline="central">EDGE FUNCTION</text>
<text x="282" y="834.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">submit-score: the only leaderboard</text>
<text x="282" y="853.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">writer; checks an ownership token</text>

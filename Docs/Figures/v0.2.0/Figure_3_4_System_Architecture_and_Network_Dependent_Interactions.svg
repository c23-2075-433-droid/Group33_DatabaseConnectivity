<text x="282" y="849.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">nickname_claims: INSERT, SELECT</text>
<text x="282" y="869.8" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">leaderboard: SELECT · rank (rpc)</text>
<rect x="266" y="896" width="262" height="86" rx="8" fill="#fff7ea" stroke="#b7791f" stroke-width="2"/>
<text x="282" y="920" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#b7791f" dominant-baseline="central">EDGE FUNCTION</text>
<text x="282" y="948.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">submit-score: the only leaderboard</text>
<text x="282" y="967.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">writer; checks an ownership token</text>
<rect x="538" y="778" width="284" height="204" rx="8" fill="#ffffff" stroke="#4a6a8a" stroke-width="2" stroke-dasharray="8 6"/>
<text x="554" y="802" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#4a6a8a" dominant-baseline="central">LEAVES THE DEVICE</text>
<text x="554" y="830.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">Level record</tspan>: nickname,</text>
<text x="554" y="849.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">score, attempts, level, remarks</text>
<text x="554" y="869.8" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">Leaderboard</tspan>: player ID,</text>
<text x="554" y="889.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">nickname, points, stars, token</text>
<text x="554" y="909.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">Name claim</tspan>: nickname,</text>
<text x="554" y="929.4" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">installation ID</text>
<text x="554" y="949.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">Never: audio, the attempt log</text>

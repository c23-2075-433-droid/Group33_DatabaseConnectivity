<text x="340.0" y="1370.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start" dominant-baseline="central">May use the network (speech service)</text>
<rect x="640" y="1360" width="30" height="20" rx="4" fill="#eef3fb" stroke="#3b5b8c" stroke-width="2"/>
<text x="680.0" y="1370.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start" dominant-baseline="central">Network: Supabase</text>
<text x="30.0" y="1404.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start" dominant-baseline="central">Answer checking, the classifier and local saving need no network. Recognition may; the level record, nickname</text>
<text x="30.0" y="1424.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start" dominant-baseline="central">claim and leaderboard do. The game itself never saves or uploads audio.</text></svg>
<text x="24" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="1" fill="#ffffff" dominant-baseline="central">PLAYER DEVICE — ANDROID 8.0+, ARM64 — SALINLAHI v0.2.0</text>
<rect x="22" y="54" width="796" height="70" rx="8" fill="#eef3fa" stroke="#4a6a8a" stroke-width="2"/>
<text x="38" y="78" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#4a6a8a" dominant-baseline="central">PRESENTATION LAYER</text>
<text x="38" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">17 Unity scenes · listening panel · scene result and words-learned panels · journey map · profiles</text>
<path d="M 420.0 136.0 L 420.0 126.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linejoin="round"/>
<rect x="22" y="136" width="796" height="110" rx="8" fill="#eef3fa" stroke="#4a6a8a" stroke-width="2"/>
<text x="38" y="160" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#4a6a8a" dominant-baseline="central">GAME LOGIC LAYER</text>
<text x="38" y="188.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">SceneObjectiveController</tspan>: a scene's ordered objectives · RunScore · LevelProgress</text>
<text x="38" y="207.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">AnswerJudge</tspan>: the word first; stress only for Tayo, Upo, Bukas, Basa, Bati, Pasok</text>
<text x="38" y="227.8" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">VoicePromptDirector + VoiceNarrator</tspan>: Teacher Rachel's lines, hints and nudges</text>
<path d="M 420.0 258.0 L 420.0 248.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linejoin="round"/>
<rect x="22" y="258" width="796" height="272" rx="8" fill="#fbf7f1" stroke="#b7791f" stroke-width="2"/>
<text x="38.0" y="277.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b7791f" text-anchor="start" dominant-baseline="central">SPEECH INPUT AND PRONUNCIATION — VoiceCommand picks the path</text>
<rect x="32" y="294" width="383" height="110" rx="8" fill="#ffffff" stroke="#4a6a8a" stroke-width="2"/>
<text x="48" y="318" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#4a6a8a" dominant-baseline="central">ORDINARY LISTENING</text>
<text x="48" y="346.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">Every word except the six where the</text>
<text x="48" y="365.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">bridge works: <tspan font-weight="bold">UnitySpeechToText</tspan> →</text>
<text x="48" y="385.8" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">Android recognizer, fil-PH; text + loudness</text>
<rect x="425" y="294" width="383" height="110" rx="8" fill="#ffffff" stroke="#4a6a8a" stroke-width="2"/>
<text x="441" y="318" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#4a6a8a" dominant-baseline="central">AUDIO BRIDGE — ANDROID 13+</text>
<text x="441" y="346.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">Six words: <tspan font-weight="bold">SalinlahiAudioRecognizer.java</tspan></text>
<text x="441" y="365.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">records up to 12 s into memory and pipes it</text>
<text x="441" y="385.8" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">to the recognizer; gives up after failures</text>
<rect x="32" y="414" width="383" height="110" rx="8" fill="#fff4dc" stroke="#b7791f" stroke-width="2"/>
<text x="48" y="438" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#b7791f" dominant-baseline="central">FALLBACK CHECK (SIX WORDS)</text>
<text x="48" y="466.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">No audio: <tspan font-weight="bold">StressAnalyzer.JudgeBanded</tspan></text>
<text x="48" y="485.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">on the loudness readings; no readings</text>
<text x="48" y="505.8" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">→ uncertain</text>
<rect x="425" y="414" width="383" height="110" rx="8" fill="#e6f4ea" stroke="#2f7d4a" stroke-width="2"/>
<text x="441" y="438" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#2f7d4a" dominant-baseline="central">ON-DEVICE CLASSIFIER (SIX WORDS)</text>
<text x="441" y="466.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">PronunciationModel</tspan>: per-word logistic</text>
<text x="441" y="485.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">regression built into the app, checked by</text>
<text x="441" y="505.8" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">safety-net judges; audio then discarded</text>
<rect x="22" y="546" width="796" height="90" rx="8" fill="#f4f8f4" stroke="#2f7d4a" stroke-width="2"/>
<text x="38" y="570" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#2f7d4a" dominant-baseline="central">LOCAL DATA LAYER</text>
<text x="38" y="598.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">players.json</tspan>: up to 10 profiles · UUID · progress · stars · points · words learned</text>
<text x="38" y="617.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">salinlahi_voice_attempts.csv</tspan>: 18 columns of text and numbers; no audio; not uploaded</text>
<rect x="8" y="730" width="236" height="262" rx="8" fill="#fff7ea" stroke="#b7791f" stroke-width="2" stroke-dasharray="8 6"/>
<text x="24" y="754" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#b7791f" dominant-baseline="central">SPEECH SERVICE</text>
<text x="24" y="782.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">Android speech service</text>
<text x="24" y="801.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">(device provider, e.g.</text>
<text x="24" y="821.8" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">Google). The standard</text>
<text x="24" y="841.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">recognizer is asked first</text>
<text x="24" y="861.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">and may process audio</text>
<text x="24" y="881.4" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">on the provider's servers;</text>
<text x="24" y="901.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">the on-device one is tried</text>
<text x="24" y="921.2" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">only after failures.</text>
<rect x="256" y="730" width="576" height="262" rx="12" fill="#ffffff" stroke="#3b5b8c" stroke-width="3"/>
<rect x="256" y="730" width="576" height="38" rx="12" fill="#3b5b8c"/><rect x="256" y="754" width="576" height="14" fill="#3b5b8c"/>

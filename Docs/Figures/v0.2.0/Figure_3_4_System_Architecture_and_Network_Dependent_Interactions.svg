<text x="554" y="691" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#4a6a8a" dominant-baseline="central">LEAVES THE DEVICE</text>
<text x="554" y="719.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">Level record</tspan>: nickname,</text>
<text x="554" y="738.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">score, attempts, level, remarks</text>
<text x="554" y="757.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">Leaderboard</tspan>: player ID,</text>
<text x="554" y="777.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">nickname, points, stars, token</text>
<text x="554" y="796.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">Name claim</tspan>: nickname,</text>
<text x="554" y="815.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">installation ID</text>
<text x="554" y="834.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">Never: audio, the attempt log</text>

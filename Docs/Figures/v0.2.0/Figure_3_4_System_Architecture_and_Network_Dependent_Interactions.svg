<rect x="266" y="778" width="262" height="110" rx="8" fill="#eef3fb" stroke="#3b5b8c" stroke-width="2"/>
<text x="282" y="802" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#3b5b8c" dominant-baseline="central">POSTGREST</text>

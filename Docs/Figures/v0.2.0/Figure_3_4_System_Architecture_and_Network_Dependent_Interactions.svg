<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1078" viewBox="0 0 840 1078"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L11,6 L0,12" fill="none" stroke="#374151" stroke-width="1.6"/></marker></defs><rect width="840" height="1078" fill="#ffffff"/><rect x="8" y="8" width="824" height="650" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>

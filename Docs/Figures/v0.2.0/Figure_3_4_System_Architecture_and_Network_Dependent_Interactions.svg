<text x="24" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="1" fill="#ffffff" dominant-baseline="central">PLAYER DEVICE — ANDROID 8.0+, ARM64 — SALINLAHI v0.2.0</text>
<rect x="22" y="52" width="801" height="128" rx="8" fill="#eef3fa" stroke="#4a6a8a" stroke-width="2"/>
<text x="38" y="76" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#4a6a8a" dominant-baseline="central">PRESENTATION AND GAME LOGIC</text>
<text x="38" y="104.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">17 Unity scenes · listening panel · result and words-learned panels · journey map · profiles</text>
<text x="38" y="123.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">SceneObjectiveController</tspan>: a scene's ordered objectives · RunScore · LevelProgress</text>
<text x="38" y="142.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">AnswerJudge</tspan>: the word first; stress only for Tayo, Upo, Bukas, Basa, Bati, Pasok</text>
<text x="38" y="162.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">VoicePromptDirector + VoiceNarrator</tspan>: Teacher Rachel's lines, hints and nudges</text>
<path d="M 422.5 190.0 L 422.5 182.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linejoin="round"/>
<rect x="22" y="190" width="801" height="266" rx="8" fill="#fbf7f1" stroke="#b7791f" stroke-width="2"/>
<text x="38.0" y="207.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b7791f" text-anchor="start" dominant-baseline="central">SPEECH INPUT AND PRONUNCIATION — VoiceCommand picks the path</text>
<rect x="32" y="222" width="385" height="109" rx="8" fill="#ffffff" stroke="#4a6a8a" stroke-width="2"/>
<text x="48" y="246" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#4a6a8a" dominant-baseline="central">ORDINARY LISTENING</text>
<text x="48" y="274.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">Every word except the six where the</text>
<text x="48" y="293.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">bridge works: <tspan font-weight="bold">UnitySpeechToText</tspan> →</text>
<text x="48" y="312.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">Android recognizer, fil-PH; text + loudness</text>
<rect x="427" y="222" width="385" height="109" rx="8" fill="#ffffff" stroke="#4a6a8a" stroke-width="2"/>
<text x="443" y="246" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#4a6a8a" dominant-baseline="central">AUDIO BRIDGE — ANDROID 13+</text>
<text x="443" y="274.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">Six words: <tspan font-weight="bold">SalinlahiAudioRecognizer.java</tspan></text>
<text x="443" y="293.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">records up to 12 s into memory and pipes it</text>
<text x="443" y="312.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">to the recognizer; gives up after failures</text>
<rect x="32" y="339" width="385" height="109" rx="8" fill="#fff4dc" stroke="#b7791f" stroke-width="2"/>
<text x="48" y="363" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#b7791f" dominant-baseline="central">FALLBACK CHECK (SIX WORDS)</text>
<text x="48" y="391.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">No audio: <tspan font-weight="bold">StressAnalyzer.JudgeBanded</tspan></text>
<text x="48" y="410.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">on the loudness readings; no readings</text>
<text x="48" y="429.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">→ uncertain</text>
<rect x="427" y="339" width="385" height="109" rx="8" fill="#e6f4ea" stroke="#2f7d4a" stroke-width="2"/>
<text x="443" y="363" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#2f7d4a" dominant-baseline="central">ON-DEVICE CLASSIFIER (SIX WORDS)</text>
<text x="443" y="391.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">PronunciationModel</tspan>: per-word logistic</text>
<text x="443" y="410.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">regression built into the app, checked by</text>
<text x="443" y="429.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">safety-net judges; audio then discarded</text>
<rect x="22" y="466" width="801" height="89" rx="8" fill="#f4f8f4" stroke="#2f7d4a" stroke-width="2"/>
<text x="38" y="490" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#2f7d4a" dominant-baseline="central">LOCAL DATA</text>
<text x="38" y="518.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">players.json</tspan>: up to 10 profiles · UUID · progress · stars · points · words learned</text>
<text x="38" y="537.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">salinlahi_voice_attempts.csv</tspan>: 18 columns of text and numbers; no audio; not uploaded</text>
<rect x="8" y="621" width="236" height="258" rx="8" fill="#fff7ea" stroke="#b7791f" stroke-width="2" stroke-dasharray="8 6"/>
<text x="24" y="645" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#b7791f" dominant-baseline="central">SPEECH SERVICE</text>
<text x="24" y="673.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">Android speech service</text>
<text x="24" y="692.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">(device provider, e.g.</text>
<text x="24" y="711.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">Google). The standard</text>
<text x="24" y="731.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">recognizer is asked first</text>
<text x="24" y="750.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">and may process audio</text>
<text x="24" y="769.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">on the provider's servers;</text>
<text x="24" y="788.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">the on-device one is tried</text>
<text x="24" y="808.2" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">only after failures.</text>
<rect x="256" y="621" width="581" height="258" rx="12" fill="#ffffff" stroke="#3b5b8c" stroke-width="3"/>
<rect x="256" y="621" width="581" height="38" rx="12" fill="#3b5b8c"/><rect x="256" y="645" width="581" height="14" fill="#3b5b8c"/>

<text x="26" y="31" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="1.2" fill="#ffffff" dominant-baseline="central">PLAYER DEVICE — ANDROID 8.0+ (API 26), ARM64 — SALINLAHI v0.2.0</text>
<rect x="30" y="62" width="940" height="108" rx="8" fill="#eef3fa" stroke="#4a6a8a" stroke-width="2"/>
<text x="46" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.2" fill="#4a6a8a" dominant-baseline="central">PRESENTATION LAYER</text>
<text x="46" y="114.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">17 Unity scenes: 15 gameplay scenes, MainMenu, LevelSelect</text>
<text x="46" y="134.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">GameplayHUD + VoiceStatusMachine (listening panel) · SceneResultPanel · WordsLearnedPanel · RachelPortraitAnimator</text>
<text x="46" y="154.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">MainMenuController · ProfilePickerPanel · LevelSelectController · WordStress (stress marks on screen)</text>
<rect x="30" y="190" width="940" height="128" rx="8" fill="#eef3fa" stroke="#4a6a8a" stroke-width="2"/>
<text x="46" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.2" fill="#4a6a8a" dominant-baseline="central">GAME LOGIC LAYER</text>
<text x="46" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">SceneObjectiveController</tspan> — the ordered objectives of a scene</text>
<text x="46" y="262.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">AnswerJudge</tspan> — the word first (PronunciationChecker + WordVariants); stress only for Tayo, Upo, Bukas, Basa, Bati, Pasok</text>
<text x="46" y="282.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">VoicePromptDirector + VoiceNarrator</tspan> — what Teacher Rachel says, and when (hints, retries, nudges)</text>
<text x="46" y="302.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">RunScore · SessionScoreTracker · LevelProgress · JourneyMap · PlayerMovement · NicknameAvailability</text>
<path d="M 500.0 190.0 L 500.0 172.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linejoin="round"/>
<rect x="30" y="338" width="940" height="372" rx="8" fill="#fbf7f1" stroke="#b7791f" stroke-width="2"/>
<text x="46.0" y="358.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b7791f" text-anchor="start" dominant-baseline="central">SPEECH INPUT AND PRONUNCIATION LAYER — VoiceCommand chooses the listening path</text>
<path d="M 500.0 338.0 L 500.0 320.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linejoin="round"/>
<rect x="45" y="378" width="455" height="155" rx="8" fill="#ffffff" stroke="#4a6a8a" stroke-width="2"/>
<text x="61" y="402" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.2" fill="#4a6a8a" dominant-baseline="central">ORDINARY LISTENING</text>
<text x="61" y="430.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">All words except the six on phones where</text>
<text x="61" y="450.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">the audio bridge works</text>
<text x="61" y="470.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">UnitySpeechToText</tspan> (yasirkula) → Android</text>
<text x="61" y="490.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">SpeechRecognizer, fil-PH: text + loudness</text>
<rect x="515" y="378" width="440" height="155" rx="8" fill="#ffffff" stroke="#4a6a8a" stroke-width="2"/>
<text x="531" y="402" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.2" fill="#4a6a8a" dominant-baseline="central">AUDIO BRIDGE — SIX WORDS, ANDROID 13+</text>
<text x="531" y="430.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">SalinlahiAudioRecognizer.java</tspan> records into</text>
<text x="531" y="450.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">memory (max. 12 s) and pipes the same audio</text>
<text x="531" y="470.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">to SpeechRecognizer (EXTRA_AUDIO_SOURCE);</text>
<text x="531" y="490.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">gives up for the session after failures</text>
<rect x="45" y="545" width="455" height="150" rx="8" fill="#fff4dc" stroke="#b7791f" stroke-width="2"/>
<text x="61" y="569" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.2" fill="#b7791f" dominant-baseline="central">FALLBACK STRESS CHECK (SIX WORDS)</text>
<text x="61" y="597.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">Used when no audio was recorded</text>
<text x="61" y="617.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">StressAnalyzer.JudgeBanded</tspan> on loudness</text>
<text x="61" y="637.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">readings; no readings → uncertain</text>
<rect x="515" y="545" width="440" height="150" rx="8" fill="#e6f4ea" stroke="#2f7d4a" stroke-width="2"/>
<text x="531" y="569" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.2" fill="#2f7d4a" dominant-baseline="central">ON-DEVICE CLASSIFIER (SIX WORDS)</text>
<text x="531" y="597.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">PronunciationModel</tspan>: logistic regression per</text>
<text x="531" y="617.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">word, weights embedded in the app; checked</text>
<text x="531" y="637.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">by safety-net judges; no network; audio is</text>
<text x="531" y="657.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">discarded after judging</text>
<rect x="30" y="728" width="940" height="92" rx="8" fill="#f4f8f4" stroke="#2f7d4a" stroke-width="2"/>
<text x="46" y="752" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.2" fill="#2f7d4a" dominant-baseline="central">LOCAL DATA LAYER</text>
<text x="46" y="780.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">players.json</tspan> (PlayerProfileStore): up to 10 profiles · UUID · progress · stars · points · words learned</text>
<text x="46" y="800.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"><tspan font-weight="bold">salinlahi_voice_attempts.csv</tspan> (VoiceAttemptLog): 18 columns of text and numbers; no audio; never uploaded</text>
<rect x="30" y="832" width="940" height="70" rx="8" fill="#f4f8f4" stroke="#2f7d4a" stroke-width="2" stroke-dasharray="8 6"/>
<text x="46" y="856" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.2" fill="#2f7d4a" dominant-baseline="central">STAYS ON THE DEVICE</text>
<text x="46" y="884.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">The game's copy of the audio (memory only) · the attempt log · profiles and progress · the trained model</text>
<rect x="10" y="1000" width="300" height="330" rx="8" fill="#fff7ea" stroke="#b7791f" stroke-width="2" stroke-dasharray="8 6"/>
<text x="26" y="1024" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.2" fill="#b7791f" dominant-baseline="central">SPEECH SERVICE</text>
<text x="26" y="1052.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">Android speech-recognition</text>
<text x="26" y="1072.3" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">service (device provider,</text>
<text x="26" y="1092.6" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">e.g. Google)</text>
<text x="26" y="1112.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central"></text>
<text x="26" y="1133.2" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">The standard recognizer</text>
<text x="26" y="1153.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">is requested; it may</text>
<text x="26" y="1173.8" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">process audio on the</text>
<text x="26" y="1194.1" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">provider's servers. The</text>
<text x="26" y="1214.4" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">on-device recognizer is</text>
<text x="26" y="1234.7" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" dominant-baseline="central">tried only after failures.</text>
<rect x="330" y="1000" width="660" height="330" rx="12" fill="#ffffff" stroke="#3b5b8c" stroke-width="3"/>
<rect x="330" y="1000" width="660" height="40" rx="12" fill="#3b5b8c"/><rect x="330" y="1026" width="660" height="14" fill="#3b5b8c"/>

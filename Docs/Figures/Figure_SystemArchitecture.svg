<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
      <path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#1f2328"/>
    </marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
      <path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#7a8290"/>
    </marker>
  </defs>

  <rect width="1180" height="700" fill="#ffffff"/>
  <text x="22" y="32" font-size="15" font-weight="bold" fill="#1f2328">Figure 3.4. SALINLAHI system architecture</text>

  <!-- ================= DEVICE ================= -->
  <rect x="22" y="52" width="580" height="580" rx="9" fill="#fbfcfd" stroke="#1f2328" stroke-width="2"/>
  <rect x="22" y="52" width="580" height="30" rx="9" fill="#1f2328"/>
  <rect x="22" y="72" width="580" height="10" fill="#1f2328"/>
  <text x="38" y="73" fill="#fff" font-size="12.5" font-weight="bold" letter-spacing="1.5">PLAYER DEVICE — ANDROID 8.0+ (API 26), ARM64</text>

  <!-- presentation -->
  <rect x="48" y="96" width="528" height="98" rx="5" fill="#eef2f7" stroke="#8b96a5" stroke-width="1.2"/>
  <text x="62" y="116" font-size="11" font-weight="bold" fill="#1f4e7a" letter-spacing="1.3">PRESENTATION LAYER</text>
  <text x="62" y="138" font-size="11.5" fill="#1f2328">17 Unity scenes — 15 gameplay, MainMenu, LevelSelect</text>
  <text x="62" y="157" font-size="11.5" fill="#1f2328">GameplayHUD · SceneResultPanel · RachelPortraitAnimator</text>
  <text x="62" y="176" font-size="11.5" fill="#1f2328">MainMenuController · LevelSelectController · UITheme</text>

  <path d="M420,212 L420,196" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)" fill="none"/>
  <text x="428" y="209" font-size="10" fill="#4a4f5a">the character acts</text>

  <!-- game logic -->
  <rect x="48" y="214" width="528" height="116" rx="5" fill="#e7eef6" stroke="#8b96a5" stroke-width="1.2"/>
  <text x="62" y="234" font-size="11" font-weight="bold" fill="#1f4e7a" letter-spacing="1.3">GAME LOGIC LAYER</text>
  <text x="62" y="256" font-size="11.5" fill="#1f2328"><tspan font-weight="bold">SceneObjectiveController</tspan> — the ordered word list of a scene</text>
  <text x="62" y="275" font-size="11.5" fill="#1f2328"><tspan font-weight="bold">PronunciationChecker</tspan> + WordVariants + WordStress — the verdict</text>
  <text x="62" y="294" font-size="11.5" fill="#1f2328">VoicePromptDirector + VoiceNarrator — what Rachel says, and when</text>
  <text x="62" y="313" font-size="11.5" fill="#1f2328">RunScore · LevelProgress · JourneyMap · PlayerMovement</text>

  <path d="M420,348 L420,332" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)" fill="none"/>
  <text x="428" y="345" font-size="10" fill="#4a4f5a">transcribed text</text>

  <!-- speech -->
  <rect x="48" y="350" width="528" height="96" rx="5" fill="#f4ece4" stroke="#8b96a5" stroke-width="1.2"/>
  <text x="62" y="370" font-size="11" font-weight="bold" fill="#8a4b1a" letter-spacing="1.3">SPEECH INPUT LAYER</text>
  <text x="62" y="392" font-size="11.5" fill="#1f2328"><tspan font-weight="bold">VoiceCommand</tspan> — the only script that knows the recognizer exists</text>
  <text x="62" y="411" font-size="11.5" fill="#1f2328">UnitySpeechToText (yasirkula), pinned to a single commit</text>
  <text x="62" y="430" font-size="11.5" fill="#1f2328">→ Android SpeechRecognizer, locale fil-PH · online only</text>

  <!-- local data -->
  <rect x="48" y="462" width="528" height="78" rx="5" fill="#eaf1ea" stroke="#8b96a5" stroke-width="1.2"/>
  <text x="62" y="482" font-size="11" font-weight="bold" fill="#1d5c2e" letter-spacing="1.3">LOCAL DATA LAYER</text>
  <text x="62" y="504" font-size="11.5" fill="#1f2328"><tspan font-weight="bold">PlayerProfileStore</tspan> → players.json — written when a level ends</text>
  <text x="62" y="523" font-size="11.5" fill="#1f2328">3 profiles · UUID · progress · stars · words learned · attempt log</text>

  <!-- privacy -->
  <rect x="48" y="552" width="528" height="58" rx="5" fill="#fff" stroke="#1d5c2e" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="62" y="573" font-size="11" font-weight="bold" fill="#1d5c2e" letter-spacing="1">STAYS ON THE DEVICE</text>
  <text x="62" y="594" font-size="11.5" fill="#1f2328">Which words were found hard · attempts per word · scenes played · stars</text>

  <!-- ================= BACKEND ================= -->
  <rect x="740" y="96" width="418" height="452" rx="9" fill="#fbfcfd" stroke="#1f2328" stroke-width="2"/>
  <rect x="740" y="96" width="418" height="30" rx="9" fill="#1f2328"/>
  <rect x="740" y="116" width="418" height="10" fill="#1f2328"/>
  <text x="756" y="117" fill="#fff" font-size="12.5" font-weight="bold" letter-spacing="1.5">SUPABASE BACKEND</text>

  <rect x="758" y="140" width="382" height="74" rx="5" fill="#eef2f7" stroke="#8b96a5" stroke-width="1.2"/>
  <text x="772" y="160" font-size="11" font-weight="bold" fill="#1f4e7a" letter-spacing="1.2">POSTGREST — publishable key</text>
  <text x="772" y="182" font-size="11.5" fill="#1f2328">INSERT / SELECT player_scores — 4 columns only</text>
  <text x="772" y="201" font-size="11.5" fill="#1f2328">SELECT leaderboard — read only</text>

  <rect x="758" y="236" width="382" height="74" rx="5" fill="#f4ece4" stroke="#8a4b1a" stroke-width="1.6"/>
  <text x="772" y="256" font-size="11" font-weight="bold" fill="#8a4b1a" letter-spacing="1.2">EDGE FUNCTION — submit-score (Deno)</text>
  <text x="772" y="278" font-size="11.5" fill="#1f2328">The ONLY writer of the leaderboard. Holds the service key.</text>
  <text x="772" y="297" font-size="11.5" fill="#1f2328">Issues a token on first submit, checks it on every later one</text>

  <!-- PostgREST reaches the tables directly, routed round the Edge Function
       rather than through it: the two write paths are independent. -->
  <path d="M800,214 L800,224 L750,224 L750,356 L756,356"
        stroke="#1f2328" stroke-width="1.5" marker-end="url(#a)" fill="none"/>
  <path d="M949,310 L949,332" stroke="#1f2328" stroke-width="1.5" marker-end="url(#a)" fill="none"/>

  <rect x="758" y="332" width="382" height="118" rx="5" fill="#eaf1ea" stroke="#8b96a5" stroke-width="1.2"/>
  <text x="772" y="352" font-size="11" font-weight="bold" fill="#1d5c2e" letter-spacing="1.2">POSTGRESQL</text>
  <text x="772" y="374" font-size="11.5" fill="#1f2328">player_scores — one row per completed level</text>
  <text x="772" y="393" font-size="11.5" fill="#1f2328">leaderboard — one row per player</text>
  <text x="772" y="412" font-size="11.5" fill="#1f2328">leaderboard_owner — SHA-256 of the token</text>
  <text x="772" y="433" font-size="10.5" fill="#4a4f5a">Row Level Security · column grants · CHECK constraints</text>

  <rect x="758" y="470" width="382" height="60" rx="5" fill="#fff" stroke="#8a4b1a" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="772" y="491" font-size="11" font-weight="bold" fill="#8a4b1a" letter-spacing="1">LEAVES THE DEVICE — FOUR VALUES ONLY</text>
  <text x="772" y="512" font-size="11.5" fill="#1f2328">player id · nickname · total points · total stars</text>

  <!-- ====== the three crossings, labelled inside the gap ====== -->
  <text x="671" y="156" font-size="10" fill="#4a4f5a" text-anchor="middle">save a level record</text>
  <path d="M602,166 L740,166" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a)" fill="none"/>

  <path d="M740,192 L602,192" stroke="#7a8290" stroke-width="1.5" marker-end="url(#ao)" fill="none" stroke-dasharray="4 3"/>
  <text x="671" y="208" font-size="10" fill="#7a8290" text-anchor="middle">board read back</text>

  <text x="671" y="262" font-size="10" fill="#4a4f5a" text-anchor="middle">submit totals</text>
  <path d="M602,272 L740,272" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a)" fill="none"/>

  <text x="671" y="300" font-size="9.5" fill="#7a8290" text-anchor="middle">HTTPS</text>
  <text x="671" y="314" font-size="9.5" fill="#7a8290" text-anchor="middle">UnityWebRequest</text>

  <!-- network note -->
  <rect x="740" y="568" width="418" height="44" rx="5" fill="#fdf3ee" stroke="#9a3412" stroke-width="1.4"/>
  <text x="756" y="588" font-size="11" font-weight="bold" fill="#9a3412">NETWORK REQUIRED</text>
  <text x="756" y="605" font-size="11" fill="#1f2328">Recognition is an online service, and the board is hosted.</text>

  <text x="22" y="664" font-size="10.5" fill="#7a8290">Four layers run on the player's device; only the leaderboard path reaches the network. The client is never trusted with a direct write to the leaderboard table.</text>
</svg>

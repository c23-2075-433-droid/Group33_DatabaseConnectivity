<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SALINLAHI Mini-Level</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">

    <header class="title-bar">
      <h1>SALINLAHI</h1>
      <p>A Voice-Interactive Filipino Language Learning Game</p>
    </header>

    <!-- Screen 1: Enter Nickname -->
    <section id="profileScreen" class="screen">
      <div class="panel">
        <div class="ribbon">CREATE PLAYER</div>
        <div class="profile-body">
          <div class="profile-form">
            <label for="playerName">What should we call you?</label>
            <input type="text" id="playerName" maxlength="15" placeholder="Nickname, e.g. Alex" />
            <button id="startBtn" class="btn">START GAME</button>
            <p id="startError" class="error"></p>
          </div>
          <div class="profile-art">👧</div>
        </div>
        <p class="quote">Handa ka na bang matuto at maglaro?</p>
      </div>
    </section>

    <!-- Screen 2: Choose an Environment -->
    <section id="envScreen" class="screen hidden">
      <div class="panel">
        <div class="ribbon">CHOOSE AN ENVIRONMENT</div>
        <p id="envGreeting" class="sub"></p>
        <div id="envGrid" class="env-grid"></div>
        <button id="changeNameBtn" class="btn btn-secondary">CHANGE NICKNAME</button>
      </div>
    </section>

    <!-- Screen 3: Level list of the chosen environment -->
    <section id="levelsScreen" class="screen hidden">
      <div class="panel">
        <div class="ribbon" id="levelsTitle"></div>
        <p id="levelsSub" class="sub"></p>
        <div id="levelList" class="level-list"></div>
        <button id="backToEnvBtn" class="btn btn-secondary">BACK TO ENVIRONMENTS</button>
      </div>
    </section>

    <!-- Screen 4: Learn the words -->
    <section id="learnScreen" class="screen hidden">
      <div class="panel">
        <div class="ribbon" id="learnTitle"></div>
        <p id="learnSub" class="sub"></p>
        <div id="wordCards" class="word-cards"></div>
        <button id="playLevelBtn" class="btn">LET'S PLAY!</button>
      </div>
    </section>

    <!-- Screen 5: Play -->
    <section id="playScreen" class="screen hidden">
      <div class="hud">
        <span id="hudPlayer"></span>
        <span id="hudLevel"></span>
        <span id="hudScore"></span>
      </div>

      <div class="scene" id="scene">
        <div class="sun">☀️</div>
        <div class="cloud c1">☁️</div>
        <div class="cloud c2">☁️</div>
        <div class="decor" id="decor"></div>
        <div class="hills" id="hills"></div>
        <div class="ground" id="ground"></div>
        <div id="bubble" class="bubble hidden"></div>
        <div id="character" class="character">🧒</div>
        <div id="obstacle" class="obstacle"></div>
      </div>

      <p id="questionText" class="question"></p>
      <div id="options" class="options"></div>
      <p id="feedback" class="feedback"></p>
    </section>

    <!-- Screen 6: Level result / reward -->
    <section id="resultScreen" class="screen hidden">
      <div class="panel">
        <div class="mission-banner" id="resBanner"></div>
        <h2 id="resTitle"></h2>
        <p id="resEnv" class="sub"></p>
        <div class="final-card">
          <ul class="stats">
            <li>Correct Answers: <strong id="statCorrect"></strong></li>
            <li>Score: <strong id="statScore"></strong></li>
          </ul>
          <div class="medal" id="medal">🏅</div>
        </div>
        <p id="saveStatus" class="save-status"></p>
        <div class="btn-row">
          <button id="nextBtn" class="btn"></button>
          <button id="resLevelsBtn" class="btn btn-secondary">LEVEL LIST</button>
          <button id="resEnvBtn" class="btn btn-secondary">ENVIRONMENTS</button>
        </div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
